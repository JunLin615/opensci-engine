name: Engine alignment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Published engine version or latest (blank checks the verified baseline)"
        required: false
        type: string
  schedule:
    - cron: "23 5 * * 1"

# PR code receives no issue-writing token, including on fork pull requests.
permissions:
  contents: read

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read baseline Python version
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          with open("engine-baseline.json", encoding="utf-8") as source:
              baseline = json.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("python=" + baseline["ci_python"] + "\n")
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.baseline.outputs.python }}
      - name: Check engine alignment
        env:
          CANDIDATE: ${{ github.event_name == 'schedule' && 'latest' || inputs.candidate || '' }}
        run: |
          args=(--out run-alignment)
          if [[ -n "$CANDIDATE" ]]; then
            args+=(--candidate "$CANDIDATE")
          fi
          python scripts/check_alignment.py "${args[@]}"
      - name: Preserve reports, logs and workflow outputs
        id: artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-alignment
          path: |
            run-alignment/
            !run-alignment/.venv/**
            !run-alignment/.catalog/**
          if-no-files-found: error
          retention-days: 30
      - name: Write job summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/report_alignment.py run-alignment/report.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL"

  report-observation:
    # Only the scheduled default-branch run can create issues. A failed alignment
    # still produces a report; manual candidate checks never publish issues.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: engine-alignment-issue-reporting
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A schedule's SHA is a trusted default-branch commit. Use its exact
          # reporter, not code from a PR or from the downloaded artifact.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/report_alignment.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-alignment
          path: run-alignment
      - name: Report a new version or failure once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.alignment.outputs.artifact-url }}
        run: |
          python3 scripts/report_alignment.py run-alignment/report.json \
            --summary "$GITHUB_STEP_SUMMARY" --publish \
            --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL"
