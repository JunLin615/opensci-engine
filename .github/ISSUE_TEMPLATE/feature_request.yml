name: Feature or documentation / 功能与文档建议
description: Suggest a capability, example, or guide / 提出功能、示例或指南建议
title: "[Idea] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: What would you like to do? / 你希望完成什么？
      description: Describe your experiment or workflow. / 描述你的实验或工作流程。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion / 你的建议
      description: A capability, example, documentation improvement, or translation. / 可以是功能、示例、文档改进或翻译。
    validations:
      required: true
